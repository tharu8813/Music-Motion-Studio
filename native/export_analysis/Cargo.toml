[package]
name = "music_motion_native"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
name = "music_motion_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Variant"] }

[profile.release]
lto = "thin"
codegen-units = 1

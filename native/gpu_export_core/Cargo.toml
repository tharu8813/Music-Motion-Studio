[package]
name = "music-motion-gpu-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental GPU-resident frame compositor for Music Motion Studio"

[dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
pollster = "0.4"
serde_json = "1.0"
sha2 = "0.10"
# Bound-safe block decompression only; no frame codec or checksum dependencies.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Variant"] }
# Runtime-loaded NVENC 13.1/12.x ABI bindings; no SDK or import libraries needed at build time.
mini-nvcodec = "=0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1

name: Lyrics Canvas revision benchmark
on:
  pull_request:
    paths:
      - tools/lyrics_canvas_revision_benchmark.py
      - .github/workflows/lyrics-canvas-revision-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compare historical and current lyric Canvas captures
        run: |
          $before = Join-Path $env:RUNNER_TEMP "lyrics-before"
          $search = Join-Path $env:RUNNER_TEMP "lyrics-search"
          git worktree add --detach $before b8f3baf6aaf90389e17a7ea5605952a2245a44b0
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed.' }
          git worktree add --detach $search 36e6462aa4a410936316c3f9a4079390e8c7bd4b
          if ($LASTEXITCODE -ne 0) { throw 'Search checkout failed.' }
          python tools/lyrics_canvas_revision_benchmark.py --before $before --search $search --raster $PWD.Path --frames 48 --output lyrics-canvas-revisions.json
          if ($LASTEXITCODE -ne 0) { throw 'Canvas comparison failed.' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lyrics-canvas-revision-benchmark
          path: lyrics-canvas-revisions.json
          if-no-files-found: ignore

name: FFmpeg rotation compatibility baseline
on:
  pull_request:
    paths:
      - '.github/workflows/ffmpeg-rotate-241.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dcee97cbbf96b3e5bde42a6315e66139058d48de
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install identical managed FFmpeg
        run: python -m scripts.setup_ci_ffmpeg
      - name: Record exact version and isolate filters
        shell: pwsh
        run: |
          & $env:PLAYLIST_CANVAS_TEST_FFMPEG -version
          @'
          import os
          import subprocess
          import json
          from pathlib import Path

          ffmpeg = os.environ["PLAYLIST_CANVAS_TEST_FFMPEG"]
          dynamic = "scale=w='16+round(t*10)':h='16+round(t*10)':eval=frame"
          rotate = "rotate='t':ow=64:oh=64:fillcolor=black@0"
          pad = "pad=w=64:h=64:x='(ow-iw)/2':y='(oh-ih)/2':color=black@0:eval=frame"
          cases = {
              "fixed_scale_rotate": "scale=24:24," + rotate,
              "dynamic_scale": dynamic,
              "dynamic_scale_rotate": dynamic + "," + rotate,
              "dynamic_scale_pad": dynamic + "," + pad,
              "dynamic_scale_pad_rotate": dynamic + "," + pad + "," + rotate,
          }
          results = {}
          for name, graph in cases.items():
              proc = subprocess.run(
                  [ffmpeg, "-hide_banner", "-loglevel", "error", "-filter_threads", "1",
                   "-f", "lavfi", "-i", "color=white:s=16x16:r=10:d=1,format=rgba",
                   "-vf", graph, "-f", "null", "-"],
                  capture_output=True, text=True, timeout=30,
              )
              results[name] = {"returncode": proc.returncode, "stderr": proc.stderr}
              print(name, proc.returncode, proc.stderr, flush=True)
          # Another fixed-envelope candidate: frame-varying overlay input.
          graph = "[0:v]" + dynamic + "[fg];[1:v][fg]overlay=x='(W-w)/2':y='(H-h)/2':format=rgb:alpha=straight," + rotate + "[out]"
          proc = subprocess.run(
              [ffmpeg, "-hide_banner", "-loglevel", "error", "-filter_complex_threads", "1",
               "-f", "lavfi", "-i", "color=white:s=16x16:r=10:d=1,format=rgba",
               "-f", "lavfi", "-i", "color=black@0:s=64x64:r=10:d=1,format=rgba",
               "-filter_complex", graph, "-map", "[out]", "-f", "null", "-"],
              capture_output=True, text=True, timeout=30,
          )
          results["dynamic_scale_overlay_rotate"] = {"returncode": proc.returncode, "stderr": proc.stderr}
          print("dynamic_scale_overlay_rotate", proc.returncode, proc.stderr, flush=True)
          Path("rotate-diagnostics.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          '@ | python -
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build native export analysis
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'No Rust export wheel was produced.' }
          python -m pip install $wheel.FullName
      - name: Run four unchanged base modules
        shell: pwsh
        run: |
          git rev-parse HEAD
          $modules = @("tests.test_custom_motion", "tests.test_keyframe_audit", "tests.test_keyframe_rendering", "tests.test_native_motion_production_parity")
          $failed = @()
          foreach ($module in $modules) {
            python -m unittest -v $module
            if ($LASTEXITCODE -ne 0) { $failed += $module }
          }
          if ($failed.Count) { throw "Unchanged baseline failures: $($failed -join ', ')" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rotation-compatibility-baseline
          path: rotate-diagnostics.json

name: Preview lifecycle soak

on:
  pull_request:
    paths:
      - .github/workflows/preview-lifecycle-soak.yml
      - tests/test_gpu_texture_surface.py
      - tests/test_real_video_preview_performance.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-mocked-gl:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
      PLAYLIST_CANVAS_RUN_PREVIEW_SOAK: "1"
      PLAYLIST_CANVAS_PREVIEW_SOAK_BACKEND: cpu
      PLAYLIST_CANVAS_PREVIEW_SOAK_SECONDS: "20"
      PLAYLIST_CANVAS_PREVIEW_REPEAT_COUNT: "5"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/export_analysis
          shared-key: windows-py314-deployment
          cache-on-failure: false
      - name: Build mandatory Rust export native module
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          $wheelDir = Join-Path $env:RUNNER_TEMP ("mms-soak-wheel-" + [guid]::NewGuid().ToString("N"))
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python --out $wheelDir
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheels = @(Get-ChildItem $wheelDir -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected exactly one freshly built wheel.' }
          python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel install failed.' }
          python scripts/rust_prerequisites.py
      - name: Install verified FFmpeg
        run: python -m scripts.setup_ci_ffmpeg
      - name: Repeated texture lifecycle (mock GL)
        run: python -m unittest -v tests.test_gpu_texture_surface.GpuTextureSurfaceTests.test_texture_lifecycle_stress_switch_resize_reuse_and_release
      - name: Real MP4 CPU playback soak
        run: |
          $env:PLAYLIST_CANVAS_TEST_FFMPEG = (Get-Command ffmpeg -ErrorAction Stop).Source
          python -m unittest -v tests.test_real_video_preview_performance.RealVideoPreviewPerformanceTests.test_long_real_mp4_preview_remains_bounded_and_responsive
      - name: Real MP4 open pause seek resume close cycles
        run: |
          $env:PLAYLIST_CANVAS_TEST_FFMPEG = (Get-Command ffmpeg -ErrorAction Stop).Source
          python -m unittest -v tests.test_real_video_preview_performance.RealVideoPreviewPerformanceTests.test_repeated_open_pause_seek_resume_close_releases_preview

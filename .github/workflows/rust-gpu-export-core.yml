name: Rust GPU export compositor validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/gpu_export_core/**'
      - '.github/workflows/rust-gpu-export-core.yml'
      - 'docs/architecture/rust-gpu-export-core.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-compositor-core:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpu_export_core
      - name: Compile Rust GPU backend and test pixel parity reference
        shell: pwsh
        run: |
          cargo test --manifest-path native/gpu_export_core/Cargo.toml --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Rust GPU compositor compilation or tests failed' }
      - name: Probe real hardware GPU and produce transparent diagnostics
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin gpu_export_probe -- --width 320 --height 180 --frames 3 --output rust-gpu-compositor-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Rust hardware GPU compositor probe failed pixel parity' }
      - name: Verify dynamic GPU input uploads and on-device NV12 conversion
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin gpu_export_dynamic_probe -- --width 320 --height 180 --frames 3 --output rust-gpu-dynamic-nv12-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'GPU NV12 compilation, reference parity, or diagnostics failed' }
      - name: Validate partial GPU frame updates and NV12 output diagnostics
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin gpu_export_dirty_probe -- --width 320 --height 180 --frames 3 --output rust-gpu-dirty-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Dirty-rectangle GPU probe failed compilation, validation, or diagnostic output' }
      - name: Upload GPU dirty-rectangle capability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gpu-dirty-ci
          path: rust-gpu-dirty-ci.json
          if-no-files-found: ignore
      - name: Upload dynamic NV12 GPU capability and parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gpu-dynamic-nv12-ci
          path: rust-gpu-dynamic-nv12-ci.json
          if-no-files-found: ignore
      - name: Test Rust native D3D11 NV12 GPU texture and row-pitch correctness
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_nv12_surface_probe -- --width 320 --height 180 --frames 3 --output rust-d3d11-nv12-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Rust D3D11 native NV12 texture verification failed' }
          @'
          import json
          from pathlib import Path
          value = json.loads(Path('rust-d3d11-nv12-ci.json').read_text(encoding='utf8'))
          if value.get('status') not in {'measured', 'd3d11_nv12_hardware_unavailable'}:
              raise SystemExit(f"Bad D3D11 native test status: {value.get('status')}")
          if value['status'] == 'measured' and not value.get('all_nv12_luma_and_chroma_bytes_identical'):
              raise SystemExit('D3D11 NV12 pixel verification did not pass')
          print('Native D3D11 NV12 status:', value['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Rust native NV12 diagnostic was invalid' }
      - name: Exercise same-device D3D11 GPU frame pool, PTS and backpressure
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_nv12_frame_pool_probe -- --width 320 --height 180 --frames 6 --slots 3 --output rust-d3d11-frame-pool-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Rust native D3D11 frame pool probe failed' }
          @'
          import json
          from pathlib import Path
          report = json.loads(Path('rust-d3d11-frame-pool-ci.json').read_text(encoding='utf-8'))
          if report.get('status') not in ('measured', 'd3d11_hardware_frame_pool_unavailable'):
              raise SystemExit('Unexpected native D3D11 frame pool status')
          if report['status'] == 'measured':
              if (not report.get('all_nv12_bytes_match_cpu_reference')
                      or report.get('frame_pool_completed') != 6):
                  raise SystemExit('Frame pool lost bytes or frames')
          print('D3D11 NV12 frame pool status:', report['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'D3D11 frame pool JSON checks failed' }
      - name: Validate same-device GPU BGRA to NV12 video conversion probe
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_bgra_nv12_video_probe -- --width 320 --height 180 --frames 4 --output d3d11-bgra-nv12-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Rust native video processor GPU conversion failed' }
          @'
          import json
          from pathlib import Path
          payload = json.loads(Path('d3d11-bgra-nv12-ci.json').read_text(encoding='utf-8'))
          accepted = {'measured','d3d11_hardware_unavailable','d3d11_video_processor_unavailable'}
          if payload.get('status') not in accepted:
              raise SystemExit(f"Unknown D3D11 video processor status: {payload.get('status')}")
          if payload['status'] == 'measured' and not payload.get('nv12_output_sanity_checks_passed'):
              raise SystemExit('D3D11 video processor failed NV12 GPU test')
          print('D3D11 GPU BGRA/NV12:', payload['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Invalid D3D11 video processor report' }
      - name: Validate D3D11 GPU color chart diagnostic (no FFmpeg required)
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_bgra_nv12_color_probe -- --width 320 --height 180 --output d3d11-bgra-color-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'D3D11 GPU color chart diagnostic failed' }
          @'
          import json
          from pathlib import Path
          p = json.loads(Path('d3d11-bgra-color-ci.json').read_text(encoding='utf-8'))
          accepted = {'measured', 'd3d11_hardware_unavailable', 'd3d11_video_processor_unavailable'}
          if p.get('status') not in accepted:
              raise SystemExit(f"Unexpected color probe status: {p.get('status')}")
          if p['status'] == 'measured' and (
              not p.get('gpu_conversion_and_diagnostic_readback_succeeded')
              or len(p.get('patches', [])) != 12
          ):
              raise SystemExit('Native D3D11 RGB patch verification failed')
          print('Native D3D11 color chart status:', p['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Invalid D3D11 GPU color diagnostic report' }
      - name: Validate D3D11 GPU EVENT-query completion and safe ring reuse
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_gpu_completion_probe -- --width 320 --height 180 --frames 6 --slots 2 --output d3d11-gpu-completion-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Native D3D11 completion query diagnostic failed' }
          @'
          import json
          from pathlib import Path
          result = json.loads(Path('d3d11-gpu-completion-ci.json').read_text(encoding='utf-8'))
          supported = {'measured', 'd3d11_hardware_unavailable', 'd3d11_video_processor_unavailable'}
          if result.get('status') not in supported:
              raise SystemExit(f"Invalid D3D11 completion result: {result.get('status')}")
          if result['status'] == 'measured' and (
              result.get('gpu_copy_event_queries_confirmed') != 6
              or result.get('frames_verified_after_gpu_copy_completion') != 6
              or result.get('pool_backpressure_rejections') != 4
              or not result.get('completed_slots_reclaimed_only_after_gpu_copy')
          ):
              raise SystemExit('D3D11 copy query or backpressure regression')
          print('D3D11 GPU completion:', result['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Invalid D3D11 completion report' }
      - name: Probe in-process NVENC DirectX session and GPU NV12 registration
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_nvenc_registration_probe -- --width 320 --height 180 --frames 6 --slots 2 --output d3d11-nvenc-register-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Native D3D11 -> NVENC register/map diagnostic failed' }
          @'
          import json
          from pathlib import Path
          report = json.loads(Path('d3d11-nvenc-register-ci.json').read_text(encoding='utf-8'))
          accepted = {
              'measured', 'd3d11_hardware_unavailable',
              'd3d11_video_processor_unavailable',
              'nvenc_library_unavailable',
          }
          if report.get('status') not in accepted:
              raise SystemExit(f"Unexpected NVENC registration status: {report.get('status')}")
          if report['status'] == 'measured':
              if (report.get('native_nv12_slots_registered_with_nvenc') != 2
                      or report.get('nvenc_nv12_resources_mapped_and_unmapped') != 6
                      or report.get('nv12_gpu_to_cpu_readbacks') != 0
                      or report.get('nvenc_h264_bitstream_encoded')):
                  raise SystemExit('NVENC registration did not preserve GPU-only contract')
          print('NVENC D3D11 registration:', report['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'NVENC registration JSON validation failed' }
      - name: Compile and probe real H264 NVENC bitstream in D3D11 ring
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_nvenc_h264_probe -- --width 320 --height 180 --frames 6 --slots 2 --video-output d3d11-nvenc-h264-ci.h264 --output d3d11-nvenc-h264-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'GPU to NVENC H264 bitstream diagnostic failed' }
          @'
          import json
          from pathlib import Path
          report = json.loads(Path('d3d11-nvenc-h264-ci.json').read_text(encoding='utf-8'))
          allowed = {'measured','d3d11_hardware_unavailable','d3d11_video_processor_unavailable','nvenc_library_unavailable'}
          status = report.get('status')
          if status not in allowed:
              raise SystemExit(f'Unexpected NVENC H264 probe status: {status}, reason: {report.get("reason")}')
          if status == 'measured':
              if (not report.get('nvenc_h264_bitstream_encoded')
                      or report.get('frames_encoded') != 6
                      or report.get('pts') != list(range(6))
                      or report.get('nv12_gpu_to_cpu_readbacks') != 0
                      or report.get('h264_annexb_bytes', 0) <= 0
                      or not Path('d3d11-nvenc-h264-ci.h264').is_file()):
                  raise SystemExit('Missing NVENC H264 frames, timestamps, or file')
          elif Path('d3d11-nvenc-h264-ci.h264').exists():
              raise SystemExit('Unsupported NVENC hardware emitted an unexpected video file')
          print('D3D11 NVENC H264 status:', status)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'NVENC H264 diagnostics JSON rejected' }
      - name: Validate native D3D11 Canvas alpha layer composition through NVENC
        shell: pwsh
        run: |
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_canvas_layers_probe -- --width 320 --height 180 --frames 6 --slots 2 --validate-alpha --output d3d11-canvas-layers-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'D3D11 native Canvas GPU alpha / NVENC probe failed' }
          @'
          import json
          from pathlib import Path
          report = json.loads(Path('d3d11-canvas-layers-ci.json').read_text(encoding='utf-8'))
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'd3d11_video_processor_unavailable',
              'nvenc_library_unavailable', 'canvas_alpha_unsupported',
          }
          status = report.get('status')
          if status not in allowed:
              raise SystemExit(f"Native Canvas alpha validation failed: {status}: {report.get('reason')}")
          if status == 'measured' and (
              report.get('frames_encoded') != 6
              or report.get('gpu_composited_layers') != 2
              or not report.get('alpha_validation_passed')
              or report.get('diagnostic_gpu_nv12_readbacks') != 6
              or report.get('gpu_to_cpu_nv12_readbacks_on_encode_path') != 0
              or report.get('qt_canvas_gpu_painting_implemented') is not False
          ):
              raise SystemExit('Canvas GPU alpha or NVENC frame contract mismatch')
          print('D3D11 Canvas GPU alpha status:', status)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Canvas GPU alpha JSON verification failed' }
      - name: Validate Qt BGRA packet manifest input through the native D3D11 compositor
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path
          root = Path('ci-native-canvas-packet')
          root.mkdir(exist_ok=True)
          width, height = 320, 180
          layers = [
              ('base', bytes([32,32,32,255]) * (width * height)),
              ('layer:0', bytes([0,0,255,128]) * (width * height)),
          ]
          entries = []
          for i, (key, payload) in enumerate(layers):
              name = f'layer-{i}.bgra'
              (root / name).write_bytes(payload)
              entries.append({
                  'stream_key': key, 'file': name, 'opacity': 1.0,
                  'bytes': len(payload), 'z_order': i,
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          (root / 'frame.json').write_text(json.dumps({
              'schema': 1, 'format': 'mms_canvas_bgra_layers_v1',
              'pixel_format': 'BGRA8_STRAIGHT', 'coordinate_origin': 'top_left',
              'width': width, 'height': height, 'layers': entries,
          }), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate native Canvas packet contract' }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin canvas_layer_manifest_probe -- --manifest ci-native-canvas-packet/frame.json --output d3d11-qt-canvas-manifest-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas packet standalone SHA256 validation failed' }
          @'
          import json
          from pathlib import Path
          packet = json.loads(Path('d3d11-qt-canvas-manifest-ci.json').read_text(encoding='utf-8'))
          if (packet.get('status') != 'verified'
                  or packet.get('layers_verified') != 2
                  or packet.get('stream_keys') != ['base','layer:0']
                  or packet.get('total_bgra_bytes') != 320 * 180 * 4 * 2
                  or packet.get('sha256_and_directory_checks_passed') is not True):
              raise SystemExit(f"Invalid Qt Canvas input contract (no GPU required): {packet}")
          print('GPU-independent native Qt packet SHA256 validator: verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas packet integrity report is invalid' }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_canvas_layers_probe -- --width 320 --height 180 --frames 6 --slots 2 --layer-manifest ci-native-canvas-packet/frame.json --output d3d11-qt-canvas-packet-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Native Qt Canvas GPU manifest -> NVENC diagnostic failed' }
          @'
          import json
          from pathlib import Path
          value = json.loads(Path('d3d11-qt-canvas-packet-ci.json').read_text(encoding='utf-8'))
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'd3d11_video_processor_unavailable',
              'nvenc_library_unavailable', 'canvas_alpha_unsupported',
          }
          if value.get('status') not in allowed:
              raise SystemExit(f"Qt Canvas packet native probe error: {value}")
          if value['status'] == 'measured':
              if (value.get('input_mode') != 'qt_canvas_manifest'
                      or not value.get('qt_canvas_packet_sha256_checked')
                      or value.get('frames_encoded') != 6
                      or value.get('gpu_composited_layers') != 2
                      or value.get('gpu_to_cpu_nv12_readbacks_on_encode_path') != 0):
                  raise SystemExit('Qt Canvas packet -> NVENC contract regression')
          print('Native Qt Canvas packet ingestion:', value['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Qt Canvas GPU packet report' }
      - name: Upload native Qt Canvas packet ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-qt-canvas-input
          path: |
            d3d11-qt-canvas-packet-ci.json
            d3d11-qt-canvas-manifest-ci.json
          if-no-files-found: ignore
      - name: Upload native D3D11 Canvas layer and NVENC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-canvas-layers
          path: d3d11-canvas-layers-ci.json
          if-no-files-found: ignore
      - name: Upload H264 NVENC bitstream diagnostics (hardware only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-nvenc-h264-probe
          path: |
            d3d11-nvenc-h264-ci.json
            d3d11-nvenc-h264-ci.h264
          if-no-files-found: ignore
      - name: Upload D3D11 -> NVENC registration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-nvenc-registration
          path: d3d11-nvenc-register-ci.json
          if-no-files-found: ignore
      - name: Upload D3D11 completion and bounded pool diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-gpu-completion
          path: d3d11-gpu-completion-ci.json
          if-no-files-found: ignore
      - name: Upload D3D11 GPU color reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-bgra-nv12-color-chart
          path: d3d11-bgra-color-ci.json
          if-no-files-found: ignore
      - name: Upload BGRA-to-NV12 GPU video processor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d11-bgra-nv12-video-processor
          path: d3d11-bgra-nv12-ci.json
          if-no-files-found: ignore
      - name: Upload native D3D11 GPU frame pool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-d3d11-frame-pool-ci
          path: rust-d3d11-frame-pool-ci.json
          if-no-files-found: ignore
      - name: Upload native NV12 GPU texture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-d3d11-nv12-texture
          path: rust-d3d11-nv12-ci.json
          if-no-files-found: ignore
      - name: Upload actual GPU or unavailable-device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gpu-compositor-ci
          path: rust-gpu-compositor-ci.json
          if-no-files-found: ignore

  gpu-shader-software-vulkan:
    # The Windows runner can compile the shader but does not expose an RTX.
    # Run the real WGSL compute shaders on Mesa's software Vulkan adapter.
    # These tests establish shader correctness, NOT RTX GPU performance.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MMS_GPU_TEST_ALLOW_SOFTWARE: "1"
      MMS_GPU_TEST_REQUIRE_ADAPTER: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpu_export_core
      - name: Install Mesa Vulkan software graphics adapter
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
      - name: Execute WGSL overlay and NV12 shaders with strict pixel equality
        shell: bash
        run: |
          cargo test --manifest-path native/gpu_export_core/Cargo.toml --lib -- --nocapture

name: Video color tile benchmark
on:
  pull_request:
    paths:
      - app/video/frame_filter.py
      - tools/video_color_tile_benchmark.py
      - .github/workflows/video-color-tile-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compare original and tiled color paths
        run: python tools/video_color_tile_benchmark.py --rounds 3 --output video-color-tiles.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: video-color-tiles
          path: video-color-tiles.json
          if-no-files-found: ignore

name: Rust export analysis verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/export_analysis/**'
      - 'app/renderer/native_export.py'
      - 'app/renderer/python_visualizer.py'
      - 'tests/test_rust_export_analysis.py'
      - 'tests/test_rust_export_pcm.py'
      - 'tools/benchmark_rust_export_analysis.py'
      - 'tools/benchmark_rust_export_pcm.py'
      - '.github/workflows/native-export-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-export:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install application dependencies and Maturin
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install "maturin>=1.9.4,<2"

      - name: Build Rust export extension
        shell: pwsh
        run: |
          rustup default stable
          cargo test --manifest-path native/export_analysis/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cargo tests failed' }
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Maturin build failed' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'Rust wheel not found' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel install failed' }

      - name: Verify NumPy parity, missing-wheel fallback and cancellation
        run: python -m unittest -v tests.test_rust_export_analysis tests.test_rust_export_pcm

      - name: Benchmark FFT and PCM kernels separately
        run: |
          python tools/benchmark_rust_export_analysis.py
          python tools/benchmark_rust_export_pcm.py

      - name: Install verified FFmpeg for visualizer export integration
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller

          installation = ManagedFFmpegInstaller(Path(os.environ["RUNNER_TEMP"]) / "rust-export-ffmpeg").install_latest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={installation.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg installation failed' }

      - name: Validate Rust-enabled actual FFmpeg export and audio/video parity
        env:
          PLAYLIST_CANVAS_ENABLE_RUST_EXPORT_ANALYSIS: "1"
        run: python -m unittest -v tests.test_visualizer_streaming.VisualizerStreamingIntegrationTests.test_final_video_and_audio_match_movie_path

name: Rust export analysis verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/export_analysis/**'
      - 'scripts/rust_prerequisites.py'
      - 'scripts/setup_rust_native.py'
      - 'scripts/run_tests.py'
      - 'scripts/verify_distribution.py'
      - 'tests/test_rust_prerequisites.py'
      - 'tests/test_distribution_verification.py'
      - 'main.py'
      - 'playlist_canvas.spec'
      - 'app/renderer/native_export.py'
      - 'app/renderer/python_visualizer.py'
      - 'app/renderer/canvas_pipe.py'
      - 'app/renderer/ffmpeg/filter_graph.py'
      - 'tests/test_canvas_pipe.py'
      - 'tests/test_rust_encoder_pipe.py'
      - 'tools/benchmark_rust_encoder_pipe.py'
      - 'tests/test_rust_export_analysis.py'
      - 'tests/test_rust_export_pcm.py'
      - 'tools/benchmark_rust_export_analysis.py'
      - 'tools/benchmark_rust_export_pcm.py'
      - '.github/workflows/native-export-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-export:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install application dependencies and Maturin
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install "maturin>=1.9.4,<2"

      - name: Build Rust export extension
        shell: pwsh
        run: |
          rustup default stable
          cargo test --manifest-path native/export_analysis/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cargo tests failed' }
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Maturin build failed' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'Rust wheel not found' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel install failed' }

      - name: Verify Rust toolchain, developer gates and native parity
        shell: pwsh
        run: |
          python scripts/rust_prerequisites.py
          if ($LASTEXITCODE -ne 0) { throw "Rust development prerequisite check failed" }
          python -m unittest -v tests.test_rust_prerequisites tests.test_distribution_verification tests.test_rust_export_analysis tests.test_rust_export_pcm tests.test_rust_encoder_pipe
          if ($LASTEXITCODE -ne 0) { throw "Rust developer and native parity tests failed" }

      - name: Benchmark FFT and PCM kernels separately
        shell: pwsh
        run: |
          python tools/benchmark_rust_export_analysis.py
          if ($LASTEXITCODE -ne 0) { throw "FFT kernel benchmark/parity failed" }
          python tools/benchmark_rust_export_pcm.py
          if ($LASTEXITCODE -ne 0) { throw "PCM kernel benchmark/parity failed" }

      - name: Install verified FFmpeg for visualizer export integration
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller

          installation = ManagedFFmpegInstaller(Path(os.environ["RUNNER_TEMP"]) / "rust-export-ffmpeg").install_latest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={installation.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg installation failed' }

      - name: Validate native BGR24 FFmpeg frame and audio equivalence
        env:
          PLAYLIST_CANVAS_ENABLE_RUST_EXPORT_ANALYSIS: "1"
        # One unittest invocation so ANY failing comparison fails the workflow.
        run: python -m unittest -v tests.test_visualizer_streaming.VisualizerStreamingIntegrationTests.test_final_video_and_audio_match_movie_path tests.test_canvas_pipe.PipedFinalRenderIntegrationTests.test_rust_bgr24_piped_export_matches_bgr0_decoded_frames tests.test_canvas_pipe.PipedFinalRenderIntegrationTests.test_piped_base_and_alpha_layer_composite_into_the_final_video

      - name: Benchmark BGR24 versus BGR0 FFmpeg input at SD, 1080p and 4K
        shell: pwsh
        run: |
          python tools/benchmark_rust_encoder_pipe.py --width 640 --height 360 --frames 60 --repeats 3 --output rust-encoder-pipe-sd.json
          if ($LASTEXITCODE -ne 0) { throw "SD benchmark failed" }
          python tools/benchmark_rust_encoder_pipe.py --width 1920 --height 1080 --frames 36 --repeats 3 --output rust-encoder-pipe-1080p.json
          if ($LASTEXITCODE -ne 0) { throw "1080p benchmark failed" }
          python tools/benchmark_rust_encoder_pipe.py --width 3840 --height 2160 --frames 8 --repeats 2 --output rust-encoder-pipe-4k.json
          if ($LASTEXITCODE -ne 0) { throw "4K benchmark failed" }

      - name: Upload encoder-input A/B timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-encoder-pipe-benchmark
          path: rust-encoder-pipe-*.json
          if-no-files-found: ignore

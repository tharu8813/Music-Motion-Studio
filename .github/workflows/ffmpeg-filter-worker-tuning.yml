name: FFmpeg overlay worker tuning experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/benchmark_ffmpeg_filter_workers.py'
      - '.github/workflows/ffmpeg-filter-worker-tuning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-ffmpeg-workers:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install Python Qt and managed FFmpeg runtime
        run: python -m pip install -r requirements-lock.txt
      - name: Install verified FFmpeg
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller
          result = ManagedFFmpegInstaller(Path(os.environ["RUNNER_TEMP"]) / "overlay-worker-lab").install_latest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={result.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Benchmark 720p actual multilayer FFmpeg filter and x264 encode
        shell: pwsh
        run: |
          python tools/benchmark_ffmpeg_filter_workers.py --ffmpeg "$env:PLAYLIST_CANVAS_TEST_FFMPEG" --width 1280 --height 720 --fps 30 --frames 90 --repeats 3 --output ffmpeg-worker-720p.json
          if ($LASTEXITCODE -ne 0) { throw '720p pixel parity or benchmark failed' }
      - name: Benchmark 1080p multilayer FFmpeg filter and x264 encode
        shell: pwsh
        run: |
          python tools/benchmark_ffmpeg_filter_workers.py --ffmpeg "$env:PLAYLIST_CANVAS_TEST_FFMPEG" --width 1920 --height 1080 --fps 30 --frames 60 --repeats 2 --output ffmpeg-worker-1080p.json
          if ($LASTEXITCODE -ne 0) { throw '1080p pixel parity or benchmark failed' }
      - name: Upload comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-overlay-worker-timings
          path: ffmpeg-worker-*.json
          if-no-files-found: ignore

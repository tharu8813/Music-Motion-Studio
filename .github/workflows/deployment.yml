name: Windows deployment verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py app tests scripts

      - name: Install verified FFmpeg for integration tests
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller

          installation = ManagedFFmpegInstaller(Path(os.environ["RUNNER_TEMP"]) / "ffmpeg-tests").install_latest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={installation.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg installation failed.' }

      - name: Run isolated test modules
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_tests.py --timeout 300 --report test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.json
          if-no-files-found: ignore

      - name: Build PyInstaller distribution
        run: python -m PyInstaller --noconfirm --clean playlist_canvas.spec

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py

      - name: Run packaged application smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "playlist-canvas-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $PWD 'dist\Music Motion Studio\Music Motion Studio.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged application smoke test timed out after 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

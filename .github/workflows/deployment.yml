name: Windows deployment verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Build mandatory Rust export native module
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'No Rust export wheel was produced.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rust export installation failed.' }
          python -c "import music_motion_native; print('Native export analysis available')"
          if ($LASTEXITCODE -ne 0) { throw 'Rust extension import failed.' }
          python scripts/rust_prerequisites.py
          if ($LASTEXITCODE -ne 0) { throw 'Rust development preflight failed.' }

      - name: Verify Rust developer prerequisites and NumPy parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_rust_prerequisites tests.test_rust_export_analysis tests.test_rust_export_pcm tests.test_distribution_verification

      - name: Benchmark optional Rust export analysis kernel
        run: python tools/benchmark_rust_export_analysis.py

      - name: Compile Python sources
        run: python -m compileall -q main.py app tests scripts tools

      - name: Verify actual Qt Canvas Z-band and straight-alpha GPU layer packets
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_native_canvas_layer_packets

      - name: Replay actual Qt Canvas source and lyric packets through native D3D11 NVENC
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m tools.native_canvas_fixture_capture --output-dir qt-canvas-ci --stem scene --scale 0.25
          if ($LASTEXITCODE -ne 0) { throw 'Cannot capture real Qt Canvas GPU layer fixture' }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_packet_probe -- --manifest qt-canvas-ci/scene.json --repeat 3 --slots 2 --video-output qt-canvas-ci/scene-output.h264 --output qt-canvas-ci/scene-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas native D3D11 GPU integration failed' }
          @'
          import json
          from pathlib import Path
          from app.preview.native_canvas_layer_packets import capture_native_canvas_frame
          manifest = json.loads(Path('qt-canvas-ci/scene.json').read_text(encoding='utf-8'))
          result = json.loads(Path('qt-canvas-ci/scene-report.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'mms_canvas_bgra_layers_v1' or len(manifest.get('layers', [])) != 2:
              raise SystemExit('Real Qt Canvas packet manifest was not generated')
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'nvenc_library_unavailable', 'canvas_gpu_compositor_unsupported',
          }
          if result.get('status') not in allowed:
              raise SystemExit(f"Qt Canvas native GPU integration failed: {result}")
          if result['status'] == 'measured':
              if (result.get('frames_encoded') != 3
                  or result.get('pts') != [0, 1, 2]
                  or result.get('layers_per_frame') != [2, 2, 2]
                  or result.get('gpu_nv12_to_cpu_readbacks') != 0
                  or result.get('qt_canvas_rasterized_on_cpu') is not True
                  or not Path('qt-canvas-ci/scene-output.h264').is_file()):
                  raise SystemExit('Real Qt layer GPU composition and NVENC replay violated frame contract')
          elif Path('qt-canvas-ci/scene-output.h264').exists():
              raise SystemExit('Unsupported NVENC setup produced a misleading H264 file')
          print('Real Qt -> native GPU -> NVENC replay:', result['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas NVENC replay report failed validation' }
      - name: Upload real Qt Canvas and D3D11 GPU replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-canvas-native-gpu-replay
          path: |
            qt-canvas-ci/scene.json
            qt-canvas-ci/scene-report.json
          if-no-files-found: ignore

      - name: Verify track lyrics player, TTML karaoke, and responsive cue layout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_track_lyrics_preview
          python -m unittest -v tests.test_lyrics_overlap.LyricsOverlapTests.test_track_settings_preview_uses_same_overlapping_and_held_lines

      - name: Verify export A/B diagnostics and wall-time reporting
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_export_ab_verify tests.test_export_bottleneck_profile tests.test_export_total_wall_timer

      - name: Verify Canvas producer queues and Win32 pipe I/O diagnostics
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_canvas_pipe.WindowsPipeWriteRegressionTests
          python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_parent_queue_backpressure_counts_full_waits_separately

      - name: Verify CFR sample pruning pixel and timeline equivalence
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_cfr_sample_pruning
          python -m unittest -v tests.test_export_frame_equivalence.ExportFrameEquivalenceTests.test_pruned_parallel_sample_schedule_preserves_animated_canvas_pixels

      - name: Verify Canvas multi-stream EOF handoff without deadlock
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_worker_eof_request_is_idempotent_and_finish_does_not_repeat_it tests.test_canvas_process_stream.CanvasProcessStreamTests.test_worker_eof_request_can_be_retried_after_queue_failure
          python -m unittest -v tests.test_export_session.CanvasWorkerEofOrderingTests

      - name: Verify uniform low-FPS Canvas overlay transport
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_low_fps_canvas_overlay

      - name: Benchmark Canvas preview Z-band optimization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.preview_ordered_canvas_benchmark --output preview-zband-benchmark.json
        continue-on-error: true

      - name: Upload preview rendering benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-zband-benchmark
          path: preview-zband-benchmark.json
          if-no-files-found: ignore

      - name: Install verified FFmpeg for integration tests
        shell: pwsh
        run: |
          @'
          import os
          import time
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller, FFmpegInstallError

          # Official FFmpeg mirror requests occasionally return transient
          # 502/503/504 errors. Retry the *verified* managed installer,
          # isolating each attempt so partial archives are never reused.
          installation = None
          for attempt in range(1, 4):
              try:
                  destination = Path(os.environ["RUNNER_TEMP"]) / f"ffmpeg-tests-attempt-{attempt}"
                  installation = ManagedFFmpegInstaller(destination).install_latest()
                  break
              except FFmpegInstallError as error:
                  if attempt == 3:
                      raise RuntimeError("Verified FFmpeg download failed after 3 attempts") from error
                  delay = (5, 20)[attempt - 1]
                  print(f"FFmpeg download attempt {attempt}/3 failed: {error}; retrying", flush=True)
                  time.sleep(delay)
          if installation is None:
              raise RuntimeError("Verified FFmpeg installation was not created")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={installation.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg installation failed.' }

      - name: Verify native NVENC H264-to-MP4 remux and optional AAC soundtrack
        shell: pwsh
        run: |
          python -m unittest -v tests.test_nvenc_probe_mux
          if ($LASTEXITCODE -ne 0) { throw 'NVENC probe MP4 remux verification failed' }

      - name: Verify real FFmpeg 60-to-12 FPS overlay pixel parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_low_fps_canvas_overlay.LowFpsCanvasOverlayTests.test_real_ffmpeg_lossless_alpha_composite_matches_full_rate_pixels

      - name: Verify live FFmpeg 60/60/12 FPS Canvas worker EOF and exact frame count
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_live_three_input_low_fps_ffmpeg_eof_and_exact_final_frame_count

      - name: Validate previously failing preview and keyframe regressions
        env:
          QT_QPA_PLATFORM: offscreen
          # Windows hosted runners have no reliable DXVA2 device. Qt's
          # documented comma-only value disables hardware decode backends.
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: |
          python -m unittest -v tests.test_custom_motion tests.test_keyframe_audit tests.test_keyframes tests.test_preview_gpu_compositor tests.test_preview_quality_presets tests.test_preview_responsiveness tests.test_text_music_reaction tests.test_preview_menu_access
          python -m unittest -v tests.test_main_window_preview.MainWindowPreviewTests.test_dynamic_canvas_source_keeps_z_order_below_static_source tests.test_main_window_preview.MainWindowPreviewTests.test_gpu_preview_adapts_render_scale_without_changing_base_quality tests.test_main_window_preview.MainWindowPreviewTests.test_preview_track_navigator_highlights_and_jumps_to_track
          python -m unittest -v tests.test_custom_motion_dialog.MotionDialogTests.test_real_video_scrub_play_loop_speed_exit_and_close_use_owned_decoder

      - name: Validate translation and keyframe editor UX
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_editor_workspace_layout
          python -m unittest -v tests.test_translation_workspace

      - name: Run isolated test modules
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: python scripts/run_tests.py --timeout 300 --report test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.json
          if-no-files-found: ignore

      - name: Build PyInstaller distribution
        run: python -m PyInstaller --noconfirm --clean playlist_canvas.spec

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py

      - name: Run packaged application smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "playlist-canvas-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $PWD 'dist\Music Motion Studio\Music Motion Studio.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged application smoke test timed out after 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

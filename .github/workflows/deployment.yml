name: Windows deployment verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py app tests scripts tools

      - name: Verify export A/B diagnostics and wall-time reporting
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_export_ab_verify tests.test_export_bottleneck_profile tests.test_export_total_wall_timer

      - name: Verify Canvas producer queues and Win32 pipe I/O diagnostics
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_canvas_pipe.WindowsPipeWriteRegressionTests
          python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_parent_queue_backpressure_counts_full_waits_separately

      - name: Verify CFR sample pruning pixel and timeline equivalence
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_cfr_sample_pruning
          python -m unittest -v tests.test_export_frame_equivalence.ExportFrameEquivalenceTests.test_pruned_parallel_sample_schedule_preserves_animated_canvas_pixels

      - name: Verify uniform low-FPS Canvas overlay transport
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_low_fps_canvas_overlay

      - name: Benchmark Canvas preview Z-band optimization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/preview_ordered_canvas_benchmark.py --output preview-zband-benchmark.json
        continue-on-error: true

      - name: Upload preview rendering benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-zband-benchmark
          path: preview-zband-benchmark.json
          if-no-files-found: ignore

      - name: Install verified FFmpeg for integration tests
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          from app.ffmpeg.managed_installer import ManagedFFmpegInstaller

          installation = ManagedFFmpegInstaller(Path(os.environ["RUNNER_TEMP"]) / "ffmpeg-tests").install_latest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLAYLIST_CANVAS_TEST_FFMPEG={installation.executable}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified FFmpeg installation failed.' }

      - name: Validate previously failing preview and keyframe regressions
        env:
          QT_QPA_PLATFORM: offscreen
          # Windows hosted runners have no reliable DXVA2 device. Qt's
          # documented comma-only value disables hardware decode backends.
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: |
          python -m unittest -v tests.test_custom_motion tests.test_keyframe_audit tests.test_keyframes tests.test_preview_gpu_compositor tests.test_preview_quality_presets tests.test_preview_responsiveness tests.test_text_music_reaction tests.test_preview_menu_access
          python -m unittest -v tests.test_main_window_preview.MainWindowPreviewTests.test_dynamic_canvas_source_keeps_z_order_below_static_source tests.test_main_window_preview.MainWindowPreviewTests.test_gpu_preview_adapts_render_scale_without_changing_base_quality tests.test_main_window_preview.MainWindowPreviewTests.test_preview_track_navigator_highlights_and_jumps_to_track
          python -m unittest -v tests.test_custom_motion_dialog.MotionDialogTests.test_real_video_scrub_play_loop_speed_exit_and_close_use_owned_decoder

      - name: Validate translation and keyframe editor UX
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_editor_workspace_layout
          python -m unittest -v tests.test_translation_workspace

      - name: Run isolated test modules
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: python scripts/run_tests.py --timeout 300 --report test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.json
          if-no-files-found: ignore

      - name: Build PyInstaller distribution
        run: python -m PyInstaller --noconfirm --clean playlist_canvas.spec

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py

      - name: Run packaged application smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "playlist-canvas-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $PWD 'dist\Music Motion Studio\Music Motion Studio.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged application smoke test timed out after 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

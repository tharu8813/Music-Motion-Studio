name: Windows deployment verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Build mandatory Rust export native module
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'No Rust export wheel was produced.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rust export installation failed.' }
          python -c "import music_motion_native; print('Native export analysis available')"
          if ($LASTEXITCODE -ne 0) { throw 'Rust extension import failed.' }
          python scripts/rust_prerequisites.py
          if ($LASTEXITCODE -ne 0) { throw 'Rust development preflight failed.' }

      - name: Verify Rust developer prerequisites and NumPy parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_rust_prerequisites tests.test_rust_export_analysis tests.test_rust_export_pcm tests.test_distribution_verification

      - name: Benchmark optional Rust export analysis kernel
        run: python tools/benchmark_rust_export_analysis.py

      - name: Compile Python sources
        run: python -m compileall -q main.py app tests scripts tools

      - name: Verify actual Qt Canvas Z-band and straight-alpha GPU layer packets
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_native_canvas_layer_packets

      - name: Replay actual Qt Canvas source and lyric packets through native D3D11 NVENC
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m tools.native_canvas_fixture_capture --output-dir qt-canvas-ci --stem scene --scale 0.25
          if ($LASTEXITCODE -ne 0) { throw 'Cannot capture real Qt Canvas GPU layer fixture' }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_packet_probe -- --manifest qt-canvas-ci/scene.json --repeat 3 --slots 2 --video-output qt-canvas-ci/scene-output.h264 --output qt-canvas-ci/scene-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas native D3D11 GPU integration failed' }
          @'
          import json
          from pathlib import Path
          from app.preview.native_canvas_layer_packets import capture_native_canvas_frame
          manifest = json.loads(Path('qt-canvas-ci/scene.json').read_text(encoding='utf-8'))
          result = json.loads(Path('qt-canvas-ci/scene-report.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'mms_canvas_bgra_layers_v1' or len(manifest.get('layers', [])) != 2:
              raise SystemExit('Real Qt Canvas packet manifest was not generated')
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'nvenc_library_unavailable', 'canvas_gpu_compositor_unsupported',
          }
          if result.get('status') not in allowed:
              raise SystemExit(f"Qt Canvas native GPU integration failed: {result}")
          if result['status'] == 'measured':
              if (result.get('frames_encoded') != 3
                  or result.get('pts') != [0, 1, 2]
                  or result.get('layers_per_frame') != [2, 2, 2]
                  or result.get('gpu_nv12_to_cpu_readbacks') != 0
                  or result.get('qt_canvas_rasterized_on_cpu') is not True
                  or not Path('qt-canvas-ci/scene-output.h264').is_file()):
                  raise SystemExit('Real Qt layer GPU composition and NVENC replay violated frame contract')
          elif Path('qt-canvas-ci/scene-output.h264').exists():
              raise SystemExit('Unsupported NVENC setup produced a misleading H264 file')
          print('Real Qt -> native GPU -> NVENC replay:', result['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas NVENC replay report failed validation' }
      - name: Upload real Qt Canvas and D3D11 GPU replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-canvas-native-gpu-replay
          path: |
            qt-canvas-ci/scene.json
            qt-canvas-ci/scene-report.json
          if-no-files-found: ignore

      - name: Verify track lyrics player, TTML karaoke, and responsive cue layout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_track_lyrics_preview
          python -m unittest -v tests.test_lyrics_overlap.LyricsOverlapTests.test_track_settings_preview_uses_same_overlapping_and_held_lines

      - name: Verify export A/B diagnostics and wall-time reporting
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_export_ab_verify tests.test_export_bottleneck_profile tests.test_export_total_wall_timer

      - name: Verify Canvas producer queues and Win32 pipe I/O diagnostics
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_canvas_pipe.WindowsPipeWriteRegressionTests
          python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_parent_queue_backpressure_counts_full_waits_separately

      - name: Verify CFR sample pruning pixel and timeline equivalence
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_cfr_sample_pruning
          python -m unittest -v tests.test_export_frame_equivalence.ExportFrameEquivalenceTests.test_pruned_parallel_sample_schedule_preserves_animated_canvas_pixels

      - name: Verify Canvas multi-stream EOF handoff without deadlock
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_worker_eof_request_is_idempotent_and_finish_does_not_repeat_it tests.test_canvas_process_stream.CanvasProcessStreamTests.test_worker_eof_request_can_be_retried_after_queue_failure
          python -m unittest -v tests.test_export_session.CanvasWorkerEofOrderingTests

      - name: Verify uniform low-FPS Canvas overlay transport
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_low_fps_canvas_overlay

      - name: Benchmark Canvas preview Z-band optimization
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.preview_ordered_canvas_benchmark --output preview-zband-benchmark.json
        continue-on-error: true

      - name: Upload preview rendering benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-zband-benchmark
          path: preview-zband-benchmark.json
          if-no-files-found: ignore

      - name: Install verified FFmpeg for integration tests
        run: python -m scripts.setup_ci_ffmpeg

      - name: Verify native NVENC H264-to-MP4 remux and optional AAC soundtrack
        shell: pwsh
        run: |
          python -m unittest -v tests.test_nvenc_probe_mux
          if ($LASTEXITCODE -ne 0) { throw 'NVENC probe MP4 remux verification failed' }

      - name: Verify time-varying Qt Canvas frame packets and full-frame H264 parity
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_native_canvas_timeline_probe
          if ($LASTEXITCODE -ne 0) { throw 'Qt Canvas timeline CPU/H264 pixel parity tests failed' }

      - name: Probe actual changing Qt Canvas frames via native D3D11 and NVENC
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m tools.native_canvas_timeline_probe capture --output-dir qt-dynamic-ci --frames 6 --scale 0.25 --fps 60
          if ($LASTEXITCODE -ne 0) { throw 'Qt dynamic frame capture failed' }
          $packetArgs = @()
          foreach ($index in (0..5)) {
            $packetArgs += '--manifest'
            $packetArgs += ('qt-dynamic-ci/frame-{0:D4}.json' -f $index)
          }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_packet_probe -- @packetArgs --repeat 1 --slots 2 --video-output qt-dynamic-ci/encoded.h264 --output qt-dynamic-ci/gpu-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Native dynamic Qt GPU Canvas probe failed' }
          @'
          import json
          from pathlib import Path
          from tools.native_canvas_timeline_probe import load_timeline
          timeline, _ = load_timeline(Path('qt-dynamic-ci/timeline.json'))
          gpu = json.loads(Path('qt-dynamic-ci/gpu-report.json').read_text(encoding='utf-8'))
          accepted = {
              'measured', 'd3d11_hardware_unavailable',
              'nvenc_library_unavailable', 'canvas_gpu_compositor_unsupported',
          }
          status = gpu.get('status')
          if status not in accepted:
              raise SystemExit(f'Unexpected dynamic Qt GPU probe status: {status}: {gpu.get("reason")}')
          if status == 'measured':
              if (gpu.get('pts') != list(range(6))
                  or gpu.get('frames_encoded') != 6
                  or gpu.get('gpu_nv12_to_cpu_readbacks') != 0
                  or not Path('qt-dynamic-ci/encoded.h264').is_file()):
                  raise SystemExit('Native dynamic Qt GPU frame count or PTS mismatch')
          elif Path('qt-dynamic-ci/encoded.h264').exists():
              raise SystemExit('Unavailable GPU emitted unexpected H264 data')
          print('Dynamic Qt GPU replay status:', status)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Dynamic Qt GPU status validation failed' }
          if (Test-Path qt-dynamic-ci/encoded.h264) {
            python -m tools.native_canvas_timeline_probe verify --timeline qt-dynamic-ci/timeline.json --video qt-dynamic-ci/encoded.h264 --report qt-dynamic-ci/parity.json
            if ($LASTEXITCODE -ne 0) { throw 'Dynamic Qt GPU full-frame image parity failed' }
          }

      - name: Upload time-varying Qt GPU pixel parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-dynamic-nvenc-parity
          path: |
            qt-dynamic-ci/timeline.json
            qt-dynamic-ci/gpu-report.json
            qt-dynamic-ci/parity.json
          if-no-files-found: ignore

      - name: Verify real TTML lyric cue timing and Qt-to-H264 full-frame parity
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_native_canvas_real_lyrics_probe
          if ($LASTEXITCODE -ne 0) { throw 'Actual PlaylistTrack TTML lyric capture/parity tests failed' }
          python -m tools.native_canvas_real_lyrics_probe --output-dir qt-real-lyrics-ci --frames 6 --fps 60 --scale 0.25
          if ($LASTEXITCODE -ne 0) { throw 'Actual LYRICS SourceItem capture failed' }
          $args = @()
          foreach ($index in (0..5)) {
            $args += '--manifest'
            $args += ('qt-real-lyrics-ci/frame-{0:D4}.json' -f $index)
          }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_packet_probe -- @args --repeat 1 --slots 2 --video-output qt-real-lyrics-ci/lyrics.h264 --output qt-real-lyrics-ci/gpu-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Native true-lyrics D3D11 NVENC replay failed' }
          @'
          from pathlib import Path
          import json
          from tools.native_canvas_timeline_probe import load_timeline
          timeline, _ = load_timeline(Path('qt-real-lyrics-ci/timeline.json'))
          assert timeline['kind'] == 'track_lyrics'
          assert timeline['frames'][2]['active_cue_indices'] == [0,1]
          gpu = json.loads(Path('qt-real-lyrics-ci/gpu-report.json').read_text(encoding='utf8'))
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'nvenc_library_unavailable', 'canvas_gpu_compositor_unsupported'
          }
          if gpu.get('status') not in allowed:
              raise SystemExit(f'Actual lyric GPU probe failed: {gpu}')
          video = Path('qt-real-lyrics-ci/lyrics.h264')
          if gpu['status'] == 'measured':
              if gpu.get('pts') != list(range(6)) or gpu.get('frames_encoded') != 6 or not video.is_file():
                  raise SystemExit('Actual lyric GPU frame order/lifetime mismatch')
          elif video.exists():
              raise SystemExit('Unavailable GPU produced unexpected H264')
          print('Actual timed LYRICS native NVENC:', gpu['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Actual-lyrics GPU report invalid' }
          if (Test-Path qt-real-lyrics-ci/lyrics.h264) {
            python -m tools.native_canvas_timeline_probe verify --timeline qt-real-lyrics-ci/timeline.json --video qt-real-lyrics-ci/lyrics.h264 --report qt-real-lyrics-ci/parity.json
            if ($LASTEXITCODE -ne 0) { throw 'Actual timed lyric GPU parity failed' }
          }

      - name: Upload actual lyric-cue GPU parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-real-track-lyrics-parity
          path: |
            qt-real-lyrics-ci/timeline.json
            qt-real-lyrics-ci/gpu-report.json
            qt-real-lyrics-ci/parity.json
          if-no-files-found: ignore

      - name: Verify real project playlist, keyframe state and Qt-to-H264 full-frame parity
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_native_canvas_project_probe
          if ($LASTEXITCODE -ne 0) { throw 'Actual serialized project Canvas timeline/parity failed' }

      - name: Replay real multi-track project packets via native D3D11 and NVENC
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from pathlib import Path
          import json
          from tests.test_native_canvas_project_probe import project_fixture
          project = Path('qt-project-ci.json')
          project.write_text(json.dumps(project_fixture().to_dict()), encoding='utf8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Could not create validated project test fixture' }
          python -m tools.native_canvas_project_probe --project qt-project-ci.json --output-dir qt-project-ci --start-seconds 0.4666666666666667 --frames 6 --fps 60 --scale 0.25
          if ($LASTEXITCODE -ne 0) { throw 'Cannot capture actual project timeline' }
          $packets = @()
          foreach ($i in (0..5)) {
            $packets += '--manifest'
            $packets += ('qt-project-ci/frame-{0:D4}.json' -f $i)
          }
          cargo run --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_packet_probe -- @packets --repeat 1 --slots 2 --video-output qt-project-ci/project.h264 --output qt-project-ci/gpu-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual project native D3D11/NVENC replay failed' }
          @'
          import json
          from pathlib import Path
          from tools.native_canvas_timeline_probe import load_timeline
          timeline, _ = load_timeline(Path('qt-project-ci/timeline.json'))
          if [f['track_number'] for f in timeline['frames']] != [1,1,2,2,2,2]:
              raise SystemExit('Compiled track ownership mismatch')
          gpu = json.loads(Path('qt-project-ci/gpu-report.json').read_text('utf8'))
          allowed = {
              'measured', 'd3d11_hardware_unavailable',
              'nvenc_library_unavailable', 'canvas_gpu_compositor_unsupported',
          }
          if gpu.get('status') not in allowed:
              raise SystemExit(f'Unexpected native project NVENC result: {gpu}')
          video = Path('qt-project-ci/project.h264')
          if gpu['status'] == 'measured':
              if gpu.get('pts') != list(range(6)) or gpu.get('frames_encoded') != 6 or not video.is_file():
                  raise SystemExit('Project H264 frame count/PTS mismatch')
          elif video.exists():
              raise SystemExit('Unavailable GPU produced misleading H264 output')
          print('Project native GPU result:', gpu['status'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Real project native GPU report validation failed' }
          if (Test-Path qt-project-ci/project.h264) {
            python -m tools.native_canvas_timeline_probe verify --timeline qt-project-ci/timeline.json --video qt-project-ci/project.h264 --report qt-project-ci/parity.json
            if ($LASTEXITCODE -ne 0) { throw 'Real project native GPU full-frame parity failed' }
          }

      - name: Upload real project GPU timeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-project-gpu-parity
          path: |
            qt-project-ci/timeline.json
            qt-project-ci/gpu-report.json
            qt-project-ci/parity.json
          if-no-files-found: ignore

      - name: Verify real FFmpeg 60-to-12 FPS overlay pixel parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_low_fps_canvas_overlay.LowFpsCanvasOverlayTests.test_real_ffmpeg_lossless_alpha_composite_matches_full_rate_pixels

      - name: Verify live FFmpeg 60/60/12 FPS Canvas worker EOF and exact frame count
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_canvas_process_stream.CanvasProcessStreamTests.test_live_three_input_low_fps_ffmpeg_eof_and_exact_final_frame_count

      - name: Validate previously failing preview and keyframe regressions
        env:
          QT_QPA_PLATFORM: offscreen
          # Windows hosted runners have no reliable DXVA2 device. Qt's
          # documented comma-only value disables hardware decode backends.
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: |
          python -m unittest -v tests.test_custom_motion tests.test_keyframe_audit tests.test_keyframes tests.test_preview_gpu_compositor tests.test_preview_quality_presets tests.test_preview_responsiveness tests.test_text_music_reaction tests.test_preview_menu_access
          python -m unittest -v tests.test_main_window_preview.MainWindowPreviewTests.test_dynamic_canvas_source_keeps_z_order_below_static_source tests.test_main_window_preview.MainWindowPreviewTests.test_gpu_preview_adapts_render_scale_without_changing_base_quality tests.test_main_window_preview.MainWindowPreviewTests.test_preview_track_navigator_highlights_and_jumps_to_track
          python -m unittest -v tests.test_custom_motion_dialog.MotionDialogTests.test_real_video_scrub_play_loop_speed_exit_and_close_use_owned_decoder

      - name: Validate translation and keyframe editor UX
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest -v tests.test_editor_workspace_layout
          python -m unittest -v tests.test_translation_workspace

      # The full 235+ module suite is verified in two independent Windows
      # runner jobs below. Qt registry/recovery state must NOT be shared
      # by concurrently running test modules on this same Windows host.

      # playlist_canvas.spec requires the D3D11/NVENC streaming worker as
      # a real executable. Earlier GPU replay steps build packet probes only.
      - name: Build Rust D3D11 NVENC production export worker for packaging
        shell: pwsh
        run: |
          cargo build --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_stream_export
          if ($LASTEXITCODE -ne 0) { throw 'Rust GPU export worker build failed.' }
          if (-not (Test-Path 'native/gpu_export_core/target/release/d3d11_qt_canvas_stream_export.exe')) {
            throw 'Rust GPU export worker executable missing after build.'
          }

      - name: Build PyInstaller distribution
        run: python -m PyInstaller --noconfirm --clean playlist_canvas.spec

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py

      - name: Run packaged application smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "playlist-canvas-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $PWD 'dist\Music Motion Studio\Music Motion Studio.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged application smoke test timed out after 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

  verify-python-tests:
    name: Isolated Python tests (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [main-window, other-modules]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Build mandatory Rust export native module
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'No Rust export wheel was produced.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rust export installation failed.' }
          python scripts/rust_prerequisites.py
          if ($LASTEXITCODE -ne 0) { throw 'Rust development preflight failed.' }

      - name: Install verified FFmpeg for integration tests
        run: python -m scripts.setup_ci_ffmpeg

      - name: Run main-window GUI modules (one process per module)
        if: matrix.group == 'main-window'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: python scripts/run_tests.py main_window --verbose --timeout 300 --report test-results.json

      - name: Run all other modules (one process per module)
        if: matrix.group == 'other-modules'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: python scripts/run_tests.py --exclude main_window --verbose --timeout 300 --report test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-${{ matrix.group }}
          path: test-results.json
          if-no-files-found: ignore


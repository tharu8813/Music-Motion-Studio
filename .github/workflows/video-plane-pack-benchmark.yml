name: Video plane packing benchmark
on:
  pull_request:
    paths:
      - app/preview/gpu_texture_surface.py
      - tools/video_plane_pack_benchmark.py
      - .github/workflows/video-plane-pack-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compare same-input mapped plane packing
        run: python tools/video_plane_pack_benchmark.py --rounds 5 --output video-plane-pack.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: video-plane-pack
          path: video-plane-pack.json
          if-no-files-found: ignore

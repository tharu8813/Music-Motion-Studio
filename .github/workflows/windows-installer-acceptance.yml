name: Windows installer acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-installer-acceptance.yml'
      - 'scripts/verify_installer_smoke.ps1'
      - 'scripts/verify_installer_upgrade_smoke.ps1'
      - 'tests/test_installer_upgrade_contract.py'
      - 'setup.iss'
      - 'playlist_canvas.spec'
      - 'scripts/verify_distribution.py'
      - 'app/__init__.py'
      - 'requirements-lock.txt'
      - 'requirements-packaging.txt'
      - 'native/**'

permissions:
  contents: read

concurrency:
  # A stable group cancels obsolete PR heads; each main/dispatch run has its own id.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Run on a disposable Windows Actions host. This does not certify a clean
# consumer Windows 11 session, but does exercise the actual Setup executable.
jobs:
  installed-setup-smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up release Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Build required Rust extension and worker
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust wheel build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'Rust wheel missing.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rust wheel installation failed.' }
          python scripts/rust_prerequisites.py
          if ($LASTEXITCODE -ne 0) { throw 'Rust prerequisites failed.' }
          cargo build --release --manifest-path native/gpu_export_core/Cargo.toml --bin d3d11_qt_canvas_stream_export
          if ($LASTEXITCODE -ne 0) { throw 'Production GPU worker build failed.' }

      - name: Check release and installer static contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_release_contract tests.test_installer_upgrade_contract tests.test_distribution_verification

      - name: Build packaged distribution
        run: python -m PyInstaller --noconfirm --clean playlist_canvas.spec

      - name: Verify packaged distribution
        run: python scripts/verify_distribution.py

      - name: Compile Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe not found after installation.' }
          & $compiler setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setups = @(Get-ChildItem 'output-setup' -Filter 'Music Motion Studio-*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one Setup executable, found $($setups.Count)." }

      - name: Test clean install, in-place reinstall, smoke and uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: |
          $setup = Get-ChildItem 'output-setup' -Filter 'Music Motion Studio-*-setup.exe' -File | Select-Object -First 1
          & ./scripts/verify_installer_smoke.ps1 -SetupPath $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed Setup acceptance failed.' }

      - name: Download latest published 1.4.0.1 Setup (SHA-256 pinned)
        shell: pwsh
        run: |
          $uri = 'https://github.com/tharu8813/Music-Motion-Studio/releases/download/1.4.0.1/Music.Motion.Studio-1.4.0.1-setup.exe'
          $download = Join-Path $env:RUNNER_TEMP 'mms-previous-public-1.4.0.1-setup.exe'
          Invoke-WebRequest -Uri $uri -OutFile $download -TimeoutSec 300
          $expectedSha256 = '4e62606f43b9c1d551cef585640ac286577154ca1f1a4e68b56b6f1edaf11563'
          $actualSha256 = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Published 1.4.0.1 setup hash mismatch: $actualSha256"
          }
          "MMS_PREVIOUS_INSTALLER=$download" >> $env:GITHUB_ENV

      - name: Test latest 1.4.0.1 to current release upgrade and uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ","
        run: |
          $current = Get-ChildItem 'output-setup' -Filter 'Music Motion Studio-*-setup.exe' -File | Select-Object -First 1
          if (-not $current) { throw 'Compiled current Setup executable missing.' }
          $currentVersion = (python -c 'from app import __version__; print(__version__)').Trim()
          if ($LASTEXITCODE -ne 0 -or $currentVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'Unable to read current app version for upgrade acceptance.'
          }
          & ./scripts/verify_installer_upgrade_smoke.ps1 -PreviousSetupPath $env:MMS_PREVIOUS_INSTALLER -CurrentSetupPath $current.FullName -ExpectedPreviousVersion '1.4.0.1' -ExpectedCurrentVersion $currentVersion
          if ($LASTEXITCODE -ne 0) { throw 'Previous-release upgrade acceptance failed.' }

      - name: Record verified Setup candidate checksum
        if: success()
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem 'output-setup' -Filter 'Music Motion Studio-*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Expected one verified installer, got $($setups.Count)." }
          $sha = (Get-FileHash -LiteralPath $setups[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($setups[0].Name)" | Set-Content -Path 'output-setup/installer.sha256' -Encoding ascii

      - name: Upload tested 1.4.1.1 Setup candidate
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: music-motion-studio-1.4.1.1-setup-candidate
          path: |
            output-setup/Music Motion Studio-*-setup.exe
            output-setup/installer.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-acceptance-logs
          path: ${{ runner.temp }}/mms-installer-acceptance-logs/**
          if-no-files-found: ignore

name: Gapless preview readiness benchmark
on:
  pull_request:
    paths:
      - tools/gapless_preview_readiness_benchmark.py
      - .github/workflows/gapless-preview-readiness-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build mandatory Rust export native module
        run: |
          rustup default stable
          python -m pip install "maturin>=1.9.4,<2"
          maturin build --release --manifest-path native/export_analysis/Cargo.toml --interpreter python
          if ($LASTEXITCODE -ne 0) { throw 'Rust export build failed.' }
          $wheel = Get-ChildItem native/export_analysis/target/wheels/*.whl | Select-Object -First 1
          if (-not $wheel) { throw 'No Rust export wheel was produced.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Rust export installation failed.' }
          python scripts/rust_prerequisites.py
      - name: Install verified FFmpeg
        run: python -m scripts.setup_ci_ffmpeg
      - name: Measure real embedded preview readiness
        run: python tools/gapless_preview_readiness_benchmark.py --seconds 60 --rounds 3 --report gapless-preview-readiness.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gapless-preview-readiness-windows
          path: gapless-preview-readiness.json
          if-no-files-found: ignore
